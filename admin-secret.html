<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الرحيق الملكي | لوحة التحكم</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍯</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #D4A843;
      --bg: #f9f9f9;
      --card-bg: #ffffff;
      --text: #333;
      --border: #ddd;
    }
    body {
      font-family: 'Cairo', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    h1 {
      text-align: center;
      color: var(--primary);
      margin-top: 0;
    }
    .alert {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .alert.success { background: #d4edda; color: #155724; display: block; }
    .alert.error { background: #f8d7da; color: #721c24; display: block; }
    .alert.info { background: #cce5ff; color: #004085; display: block; }
    
    .form-section {
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .form-section h3 { margin-top: 0; color: #555; }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input[type="text"], input[type="number"], input[type="url"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      box-sizing: border-box;
      direction: ltr;
    }
    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      transition: opacity 0.3s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">
  <h1>👑 لوحة تحكم الرحيق الملكي</h1>
  
  <!-- Setup Web App URL -->
  <div class="form-section" style="background:#fff3cd; padding:20px; border-radius:8px; border:1px solid #ffeeba;">
    <h3>🔗 رابط الـ Backend (Google Apps Script)</h3>
    <p style="font-size: 0.9rem; margin-top:0;">ضع هنا رابط التطبيق الذي حصلت عليه بعد نشر السكريبت في Google Sheets.</p>
    <div class="form-group">
      <input type="url" id="webapp-url" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
    </div>
    <button class="btn" onclick="loadConfig()" style="background:#856404;">
      <span class="spinner" id="load-spinner"></span>
      تحميل الإعدادات الحالية
    </button>
  </div>

  <div id="alert-box" class="alert"></div>

  <!-- Configuration Form -->
  <form id="config-form" style="display: none;">
    
    <div class="form-section">
      <h3>📈 إعدادات التتبع (Pixels)</h3>
      <div class="form-group">
        <label>Facebook Pixel ID</label>
        <input type="text" id="FB_PIXEL_ID" placeholder="مثال: 1234567890">
      </div>
      <div class="form-group">
        <label>TikTok Pixel ID</label>
        <input type="text" id="TIKTOK_PIXEL_ID" placeholder="مثال: CXXXXXXXXXXXXX">
      </div>
    </div>

    <div class="form-section">
      <h3>🤖 إعدادات تليجرام</h3>
      <div class="form-group">
        <label>Telegram Bot Token</label>
        <input type="text" id="TELEGRAM_BOT_TOKEN" placeholder="مثال: 7123456789:AAFxxxxxxxxxxxxxxx">
      </div>
      <div class="form-group">
        <label>Telegram Chat ID</label>
        <input type="text" id="TELEGRAM_CHAT_ID" placeholder="مثال: 904615485">
      </div>
    </div>

    <div class="form-section">
      <h3>💰 إعدادات الأسعار (بالدرهم)</h3>
      <div class="form-group">
        <label>سعر الباقة 1 (عبوة واحدة)</label>
        <input type="number" id="PRICE_PACKAGE_1" placeholder="180">
      </div>
      <div class="form-group">
        <label>سعر الباقة 2 (عبوتان)</label>
        <input type="number" id="PRICE_PACKAGE_2" placeholder="300">
      </div>
      <div class="form-group">
        <label>سعر الباقة 3 (ثلاث عبوات)</label>
        <input type="number" id="PRICE_PACKAGE_3" placeholder="450">
      </div>
    </div>

    <button type="button" class="btn" onclick="saveConfig()" id="save-btn" style="width:100%;">
      <span class="spinner" id="save-spinner"></span>
      حفظ الإعدادات
    </button>
  </form>

</div>

<script>
  // استرجاع الرابط المحفوظ
  const savedUrl = localStorage.getItem('GAS_WEBAPP_URL');
  if (savedUrl) {
    document.getElementById('webapp-url').value = savedUrl;
  }

  function showAlert(msg, type) {
    const box = document.getElementById('alert-box');
    box.className = 'alert ' + type;
    box.textContent = msg;
  }

  async function loadConfig() {
    const url = document.getElementById('webapp-url').value.trim();
    if (!url) {
      showAlert('يرجى إدخال رابط الـ Web App أولاً', 'error');
      return;
    }

    document.getElementById('load-spinner').style.display = 'inline-block';
    
    try {
      const response = await fetch(url + '?action=getConfig');
      const result = await response.json();
      
      if (result.status === 'success') {
        const data = result.data;
        document.getElementById('FB_PIXEL_ID').value = data.FB_PIXEL_ID || '';
        document.getElementById('TIKTOK_PIXEL_ID').value = data.TIKTOK_PIXEL_ID || '';
        document.getElementById('TELEGRAM_BOT_TOKEN').value = data.TELEGRAM_BOT_TOKEN || '';
        document.getElementById('TELEGRAM_CHAT_ID').value = data.TELEGRAM_CHAT_ID || '';
        document.getElementById('PRICE_PACKAGE_1').value = data.PRICE_PACKAGE_1 || '';
        document.getElementById('PRICE_PACKAGE_2').value = data.PRICE_PACKAGE_2 || '';
        document.getElementById('PRICE_PACKAGE_3').value = data.PRICE_PACKAGE_3 || '';
        
        // Save URL and show form
        localStorage.setItem('GAS_WEBAPP_URL', url);
        document.getElementById('config-form').style.display = 'block';
        showAlert('تم تحميل الإعدادات بنجاح!', 'success');
      } else {
        showAlert('خطأ في جلب الإعدادات. تأكد من الرابط.', 'error');
      }
    } catch (e) {
      showAlert('فشل الاتصال بالخادم. قد يكون الرابط خاطئاً أو لديك مشكلة CORS.', 'error');
    } finally {
      document.getElementById('load-spinner').style.display = 'none';
    }
  }

  async function saveConfig() {
    const url = document.getElementById('webapp-url').value.trim();
    const btn = document.getElementById('save-btn');
    const spinner = document.getElementById('save-spinner');
    
    const data = {
      FB_PIXEL_ID: document.getElementById('FB_PIXEL_ID').value.trim(),
      TIKTOK_PIXEL_ID: document.getElementById('TIKTOK_PIXEL_ID').value.trim(),
      TELEGRAM_BOT_TOKEN: document.getElementById('TELEGRAM_BOT_TOKEN').value.trim(),
      TELEGRAM_CHAT_ID: document.getElementById('TELEGRAM_CHAT_ID').value.trim(),
      PRICE_PACKAGE_1: document.getElementById('PRICE_PACKAGE_1').value.trim(),
      PRICE_PACKAGE_2: document.getElementById('PRICE_PACKAGE_2').value.trim(),
      PRICE_PACKAGE_3: document.getElementById('PRICE_PACKAGE_3').value.trim()
    };

    btn.disabled = true;
    spinner.style.display = 'inline-block';
    showAlert('جاري الحفظ...', 'info');

    try {
      const response = await fetch(url, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveConfig', data: data }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' } // text/plain to avoid CORS preflight issues with some GAS setups
      });
      
      const result = await response.json();
      if (result.status === 'success') {
        showAlert('تم حفظ الإعدادات بنجاح!', 'success');
      } else {
        showAlert('خطأ أثناء الحفظ: ' + result.message, 'error');
      }
    } catch (e) {
      showAlert('فشل الاتصال بالخادم أثناء الحفظ.', 'error');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
    }
  }
</script>
</body>
</html>
